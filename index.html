<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell War - Play in Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 1280px;
            height: 100vh;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f3460;
            border: 3px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.1);
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00d4ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #00d4ff;
            font-size: 12px;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            #game-container {
                max-width: 100vw;
                max-height: 100vh;
                border: none;
            }

            .loading {
                font-size: 18px;
            }
        }

        .error {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            background-color: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff3333;
            color: #ff3333;
            border-radius: 8px;
            display: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 100px;
            overflow-y: auto;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading">
            <div>Cell War</div>
            <div class="loading-spinner"></div>
            <div>Loading...</div>
        </div>
        <div class="error" id="error-message"></div>
        <div class="info">v0.1.0</div>
    </div>

    <script type="module">
        import init, * as wasm from './pkg/cell_war.js';

        async function run() {
            try {
                // Initialize the WASM module
                await init();
                console.log('Cell War loaded successfully!');
            } catch (error) {
                console.error('Failed to load Cell War:', error);
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = 'Error loading game: ' + error.message;
                errorDiv.classList.add('show');
            }
        }

        run();
    </script>
</body>
</html>
